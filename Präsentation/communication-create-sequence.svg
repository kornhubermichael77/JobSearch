<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .text { font: 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .lane { stroke: #cbd5e1; stroke-width: 2; rx: 14; ry: 14; }
      .head { stroke: #1e293b; stroke-width: 2; rx: 14; ry: 14; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowSoft); }
      .note { stroke: #cbd5e1; stroke-width: 1.5; rx: 12; ry: 12; }
      .activation { stroke: #1e293b; stroke-width: 1.5; rx: 8; ry: 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="70" y="70" class="title">Communication Create - kompakte Sequenzdarstellung</text>

  <rect x="80" y="110" width="1440" height="820" class="lane" fill="#f8fafc"/>

  <rect x="120" y="140" width="170" height="70" class="head" fill="#dbeafe"/>
  <text x="205" y="180" text-anchor="middle" class="label">Client / Frontend</text>

  <rect x="350" y="140" width="190" height="70" class="head" fill="#e0f2fe"/>
  <text x="445" y="180" text-anchor="middle" class="label">Controller</text>

  <rect x="610" y="140" width="190" height="70" class="head" fill="#dcfce7"/>
  <text x="705" y="180" text-anchor="middle" class="label">Service</text>

  <rect x="870" y="140" width="190" height="70" class="head" fill="#fee2e2"/>
  <text x="965" y="180" text-anchor="middle" class="label">Factory</text>

  <rect x="1130" y="140" width="190" height="70" class="head" fill="#fef3c7"/>
  <text x="1225" y="180" text-anchor="middle" class="label">Creator</text>

  <rect x="1390" y="140" width="90" height="70" class="head" fill="#ede9fe"/>
  <text x="1435" y="170" text-anchor="middle" class="label">Repo</text>
  <text x="1435" y="194" text-anchor="middle" class="small">Mapper</text>

  <path d="M205 210 L205 880" class="lifeline"/>
  <path d="M445 210 L445 880" class="lifeline"/>
  <path d="M705 210 L705 880" class="lifeline"/>
  <path d="M965 210 L965 880" class="lifeline"/>
  <path d="M1225 210 L1225 880" class="lifeline"/>
  <path d="M1435 210 L1435 880" class="lifeline"/>

  <rect x="438" y="255" width="14" height="70" class="activation" fill="#bae6fd"/>
  <rect x="698" y="315" width="14" height="280" class="activation" fill="#bbf7d0"/>
  <rect x="958" y="375" width="14" height="90" class="activation" fill="#fecaca"/>
  <rect x="1218" y="435" width="14" height="70" class="activation" fill="#fde68a"/>
  <rect x="1428" y="705" width="14" height="100" class="activation" fill="#ddd6fe"/>

  <path d="M205 260 L445 260" class="arrow"/>
  <text x="325" y="248" text-anchor="middle" class="text">1. POST /api/communications</text>

  <path d="M445 320 L705 320" class="arrow"/>
  <text x="575" y="308" text-anchor="middle" class="text">2. service.create(req)</text>

  <path d="M705 380 L965 380" class="arrow"/>
  <text x="835" y="368" text-anchor="middle" class="text">3. factory.create(req)</text>

  <path d="M965 440 L1225 440" class="arrow"/>
  <text x="1095" y="428" text-anchor="middle" class="text">4. passenden Creator wählen</text>

  <path d="M1225 500 L965 500" class="return"/>
  <text x="1095" y="488" text-anchor="middle" class="text">5. konkrete Communication-Unterklasse zurück</text>

  <path d="M965 560 L705 560" class="return"/>
  <text x="835" y="548" text-anchor="middle" class="text">6. neue Entity an Service zurück</text>

  <rect x="565" y="605" width="280" height="95" class="note" fill="#ffffff"/>
  <text x="705" y="635" text-anchor="middle" class="label">Service ergänzt und prüft</text>
  <text x="705" y="662" text-anchor="middle" class="small">applyCommonFields(...)</text>
  <text x="705" y="685" text-anchor="middle" class="small">validateTypeSpecificFields(...)</text>

  <path d="M705 730 L1435 730" class="arrow"/>
  <text x="1070" y="718" text-anchor="middle" class="text">7. repository.save(c)</text>

  <path d="M1435 790 L705 790" class="return"/>
  <text x="1070" y="778" text-anchor="middle" class="text">8. gespeicherte Entity zurück</text>

  <path d="M705 835 L1435 835" class="arrow"/>
  <text x="1070" y="823" text-anchor="middle" class="text">9. mapper.toDto(saved)</text>

  <path d="M1435 865 L445 865" class="return"/>
  <text x="940" y="853" text-anchor="middle" class="text">10. CommunicationResponseDTO</text>

  <path d="M445 895 L205 895" class="return"/>
  <text x="325" y="883" text-anchor="middle" class="text">11. HTTP 201 Created</text>

  <rect x="1120" y="580" width="250" height="95" class="note" fill="#ffffff"/>
  <text x="1245" y="610" text-anchor="middle" class="label">Creator-Beispiele</text>
  <text x="1245" y="637" text-anchor="middle" class="small">MailCommunicationCreator</text>
  <text x="1245" y="660" text-anchor="middle" class="small">PhoneCommunicationCreator, ...</text>

  <rect x="120" y="580" width="280" height="110" class="note" fill="#ffffff"/>
  <text x="260" y="610" text-anchor="middle" class="label">Wichtige Idee</text>
  <text x="260" y="637" text-anchor="middle" class="small">Die Factory erzeugt nur den passenden</text>
  <text x="260" y="660" text-anchor="middle" class="small">Untertyp. Die Fachlogik bleibt im Service.</text>
  <text x="260" y="683" text-anchor="middle" class="small">Dadurch bleiben Verantwortlichkeiten getrennt.</text>
</svg>
